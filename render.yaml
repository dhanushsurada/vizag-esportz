## ─────────────────────────────────────────────────────────────────────────────
## render.yaml — Vizag Esportz
## Web service deployed on Render with Neon Serverless PostgreSQL
## ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: vizag-esportz
    runtime: python
    plan: free                    # Free tier: 512 MB RAM, 0.1 CPU, spins down after 15 min inactivity
    buildCommand: "./build.sh"
    startCommand: "gunicorn nsrit_esports.wsgi:application --workers 4 --threads 8 --worker-class gthread --timeout 120 --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false               # Set this to your Neon PostgreSQL connection string in Render Dashboard
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          name: vizag-esportz
          type: web
          property: host
      - key: ALLOWED_HOSTS
        fromService:
          name: vizag-esportz
          type: web
          property: host
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@vizagesportz.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false               # Optional: set custom admin password, or defaults to Admin@1234
      # ── Fill these in manually in Render Dashboard ──────────────────────────
      # DATABASE_URL           → Neon Connection String (e.g. postgresql://user:pass@ep-xyz-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require)
      # EMAIL_HOST_USER        → your Gmail address
      # EMAIL_HOST_PASSWORD    → Gmail App Password
      # RAZORPAY_KEY_ID        → from Razorpay dashboard
      # RAZORPAY_KEY_SECRET    → from Razorpay dashboard
      # ADMIN_URL              → optional secret admin path, e.g. control-panel-x9k2/
